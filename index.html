<!DOCTYPE html>
 <html>
 <head>
   <title>Web Chat</title>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <style>
     * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
     body { background: #e5ddd5; min-height: 100vh; }
     /* === HALAMAN LOGIN — TETAP UNGU MENYALA === */
     #halamanMasuk {
       display: flex;
       flex-direction: column;
       align-items: center;
       justify-content: center;
       min-height: 100vh;
       background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
       color: white;
       padding: 20px;
     }
     #halamanMasuk h1 { font-size: 32px; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
     #dev-nama { font-size: 15px; opacity: 0.9; margin-bottom: 50px; font-style: italic; }
     #halamanMasuk input {
       width: 100%; max-width: 350px;
       padding: 16px 20px;
       border-radius: 12px;
       border: none;
       font-size: 16px;
       background: white;
       color: #333;
       box-shadow: 0 4px 15px rgba(0,0,0,0.15);
     }
     #halamanMasuk button {
       margin-top: 25px;
       padding: 15px 45px;
       background: white;
       color: #6c5ce7;
       border: none;
       border-radius: 12px;
       font-size: 17px;
       font-weight: 700;
       cursor: pointer;
       box-shadow: 0 4px 15px rgba(0,0,0,0.2);
       transition: transform 0.2s;
     }
     #halamanMasuk button:active { transform: scale(0.95); }
     /* === HALAMAN CHAT — GAYA WHATSAPP === */
     #halamanChat { display: none; min-height: 100vh; }
     /* === HEADER ATAS === */
     .chat-header {
       background: #075e54;
       color: white;
       padding: 12px 16px;
       display: flex;
       align-items: center;
       position: sticky;
       top: 0;
       z-index: 100;
     }
     .chat-header .avatar {
       width: 40px; height: 40px;
       border-radius: 50%;
       background: #128c7e;
       display: flex; align-items: center; justify-content: center;
       font-size: 18px; margin-right: 12px;
     }
     .chat-header .info h3 { font-size: 16px; font-weight: 600; }
     .chat-header .info p { font-size: 12px; opacity: 0.8; }
     /* === DAFTAR PESAN === */
     #daftarPesan {
       padding: 16px;
       padding-bottom: 90px;
       min-height: calc(100vh - 130px);
       background-image: url("https://web.whatsapp.com/img/bg-chat-tile-dark_a4be512e7195b6b733d9110b408f075d.png");
       background-color: #e5ddd5;
     }
     /* === BUBBLE PESAN === */
     .pesan {
       max-width: 75%;
       padding: 10px 14px;
       margin: 6px 0;
       border-radius: 8px;
       position: relative;
       box-shadow: 0 1px 2px rgba(0,0,0,0.1);
       animation: fadeIn 0.3s ease;
     }
     @keyframes fadeIn {
       from { opacity: 0; transform: translateY(10px); }
       to { opacity: 1; transform: translateY(0); }
     }
     .pesan.kirim {
       background: #d9fdd3;
       margin-left: auto;
       border-radius: 8px 0 8px 8px;
     }
     .pesan.terima {
       background: white;
       margin-right: auto;
       border-radius: 0 8px 8px 8px;
     }
     .pesan .nama {
       font-size: 12px;
       font-weight: 600;
       color: #075e54;
       margin-bottom: 4px;
     }
     .pesan .teks {
       font-size: 15px;
       line-height: 1.4;
       color: #333;
       word-wrap: break-word;
     }
     .pesan .waktu {
       font-size: 10px;
       color: #999;
       text-align: right;
       margin-top: 4px;
     }
     .pesan img {
       max-width: 100%;
       border-radius: 6px;
       margin: 6px 0;
     }
     /* === TOMBOL HAPUS PESAN === */
     .pesan .hapus-btn {
       position: absolute;
       top: -8px;
       right: -8px;
       width: 24px;
       height: 24px;
       border-radius: 50%;
       background: #e74c3c;
       color: white;
       border: 2px solid white;
       font-size: 12px;
       line-height: 20px;
       text-align: center;
       cursor: pointer;
       display: none;
       box-shadow: 0 2px 6px rgba(0,0,0,0.2);
       transition: transform 0.2s;
     }
     .pesan .hapus-btn:active {
       transform: scale(0.85);
     }
     .pesan:hover .hapus-btn {
       display: block;
     }
     .pesan.kirim .hapus-btn {
       right: -8px;
       left: auto;
     }
     .pesan.terima .hapus-btn {
       left: -8px;
       right: auto;
     }
     /* === EFEK HAPUS === */
     .pesan.hapus-animasi {
       animation: hapusAnim 0.4s ease forwards;
     }
     @keyframes hapusAnim {
       0% { opacity: 1; transform: scale(1); }
       100% { opacity: 0; transform: scale(0.8) translateX(-20px); }
     }
     /* === KOTAK KIRIM BAWAH — LEBIH KEREN === */
     .chat-input {
       position: fixed;
       bottom: 0; left: 0; right: 0;
       background: #f0f2f5;
       padding: 10px 12px;
       display: flex;
       align-items: center;
       gap: 8px;
       border-top: 1px solid #ddd;
       backdrop-filter: blur(10px);
       background: rgba(240, 242, 245, 0.95);
     }
     .chat-input input[type="text"] {
       flex: 1;
       padding: 12px 16px;
       border-radius: 24px;
       border: none;
       font-size: 15px;
       background: white;
       outline: none;
       box-shadow: 0 1px 2px rgba(0,0,0,0.05);
       transition: box-shadow 0.3s, transform 0.2s;
     }
     .chat-input input[type="text"]:focus {
       box-shadow: 0 0 0 2px #25d366, 0 2px 8px rgba(37, 211, 102, 0.3);
     }
     .chat-input .btn-foto, .chat-input .btn-kirim {
       width: 44px; height: 44px;
       border-radius: 50%;
       border: none;
       display: flex; align-items: center; justify-content: center;
       font-size: 20px;
       cursor: pointer;
       flex-shrink: 0;
       transition: transform 0.2s, box-shadow 0.3s;
     }
     .chat-input .btn-foto {
       background: #f0f2f5;
       color: #555;
     }
     .chat-input .btn-foto:active {
       transform: scale(0.9);
     }
     .chat-input .btn-kirim {
       background: #25d366;
       color: white;
       box-shadow: 0 2px 8px rgba(37, 211, 102, 0.4);
       font-size: 22px;
     }
     .chat-input .btn-kirim:active {
       transform: scale(0.9);
     }
     .chat-input .btn-kirim svg {
       width: 22px;
       height: 22px;
       fill: white;
       transition: transform 0.3s;
     }
     .chat-input .btn-kirim:active svg {
       transform: translateX(3px) translateY(-3px);
     }
     /* === STIKER EMOJI === */
     .emoji-picker {
       position: fixed;
       bottom: 80px;
       left: 10px;
       background: white;
       border-radius: 12px;
       box-shadow: 0 4px 20px rgba(0,0,0,0.15);
       padding: 12px;
       display: none;
       flex-wrap: wrap;
       gap: 6px;
       max-width: 260px;
       z-index: 200;
       border: 1px solid #eee;
     }
     .emoji-picker span {
       font-size: 28px;
       cursor: pointer;
       padding: 4px;
       border-radius: 8px;
       transition: background 0.2s;
       width: 40px;
       text-align: center;
     }
     .emoji-picker span:hover {
       background: #f0f2f5;
     }
     .btn-emoji {
       width: 44px; height: 44px;
       border-radius: 50%;
       border: none;
       background: #f0f2f5;
       font-size: 22px;
       cursor: pointer;
       flex-shrink: 0;
       transition: transform 0.2s;
     }
     .btn-emoji:active { transform: scale(0.9); }
   </style>
 </head>
 <body>
 <!-- HALAMAN LOGIN — UNGU MENYALA + NAMA XAVERIUS -->
 <div id="halamanMasuk">
   <h1>💬 Web Chat</h1>
   <p id="dev-nama">✨ Dibuat oleh • Xaverius ✨</p>
   <p>Masukkan nama untuk mulai mengobrol</p>
   <br>
   <input type="text" id="namaInput" placeholder="Masukkan nama kamu...">
   <br><br>
   <button onclick="masukObrolan()">Masuk Obrolan</button>
 </div>
 <!-- HALAMAN CHAT — GAYA WHATSAPP -->
 <div id="halamanChat">
   <div class="chat-header">
     <div class="avatar">💬</div>
     <div class="info">
       <h3>Web Chat</h3>
       <p>Terhubung dengan semua orang</p>
     </div>
   </div>
   <div id="daftarPesan"></div>
   <!-- EMOJI PICKER -->
   <div class="emoji-picker" id="emojiPicker">
     <span onclick="tambahEmoji('😊')">😊</span>
     <span onclick="tambahEmoji('😂')">😂</span>
     <span onclick="tambahEmoji('🤣')">🤣</span>
     <span onclick="tambahEmoji('❤️')">❤️</span>
     <span onclick="tambahEmoji('🔥')">🔥</span>
     <span onclick="tambahEmoji('👍')">👍</span>
     <span onclick="tambahEmoji('🙏')">🙏</span>
     <span onclick="tambahEmoji('👋')">👋</span>
     <span onclick="tambahEmoji('😍')">😍</span>
     <span onclick="tambahEmoji('🥰')">🥰</span>
     <span onclick="tambahEmoji('😘')">😘</span>
     <span onclick="tambahEmoji('💪')">💪</span>
   </div>
   <div class="chat-input">
     <input type="file" id="inputFoto" accept="image/*" style="display:none;" onchange="pilihFoto(this)">
     <button class="btn-foto" onclick="document.getElementById('inputFoto').click()">📎</button>
     <button class="btn-emoji" onclick="toggleEmoji()">😀</button>
     <input type="text" id="inputPesan" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter') kirimPesan()">
     <button class="btn-kirim" onclick="kirimPesan()">
       <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
         <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
       </svg>
     </button>
   </div>
 </div>
 <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
 <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
 <script>
   const firebaseConfig = {
     apiKey: "AIzaSyBQ0_bbQ1FPRUx1zwi57klC329AG7H9Fwk",
     authDomain: "web-chat-saya.firebaseapp.com",
     databaseURL: "https://web-chat-saya-default-rtdb.asia-southeast1.firebasedatabase.app/",
     projectId: "web-chat-saya",
     storageBucket: "web-chat-saya.firebasestorage.app",
     messagingSenderId: "339753603338",
     appId: "1:339753603338:web:89fa40e03f3ead1c7f1a2b"
   };
   firebase.initializeApp(firebaseConfig);
   const db = firebase.database();
   let namaSaya = "";
   const pesanElements = new Map();

   function masukObrolan() {
     namaSaya = document.getElementById('namaInput').value.trim();
     if (!namaSaya) { alert('Masukkan nama dulu!'); return; }
     localStorage.setItem('namaPengguna', namaSaya);
     document.getElementById('halamanMasuk').style.display = 'none';
     document.getElementById('halamanChat').style.display = 'block';
   }

   function kirimPesan() {
     const teks = document.getElementById('inputPesan').value.trim();
     if (!teks) return;
     const ref = db.ref('pesan').push({
       nama: namaSaya,
       teks: teks,
       waktu: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})
     });
     document.getElementById('inputPesan').value = '';
   }

   function pilihFoto(input) {
     if (!input.files || !input.files[0]) return;
     const file = input.files[0];
     if (file.size > 2 * 1024 * 1024) {
       alert('Ukuran foto terlalu besar! Maksimal 2MB.');
       input.value = '';
       return;
     }
     const reader = new FileReader();
     reader.onload = function(e) {
       db.ref('pesan').push({
         nama: namaSaya,
         foto: e.target.result,
         waktu: new Date().toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})
       });
     };
     reader.readAsDataURL(file);
     input.value = '';
   }

   function toggleEmoji() {
     const picker = document.getElementById('emojiPicker');
     picker.style.display = picker.style.display === 'flex' ? 'none' : 'flex';
   }

   function tambahEmoji(emoji) {
     const input = document.getElementById('inputPesan');
     input.value += emoji;
     input.focus();
     document.getElementById('emojiPicker').style.display = 'none';
   }

   function hapusPesan(key, element) {
     if (!confirm('Hapus pesan ini?')) return;
     element.classList.add('hapus-animasi');
     setTimeout(() => {
       db.ref('pesan/' + key).remove()
         .then(() => {})
         .catch(err => {
           alert('Gagal menghapus pesan: ' + err.message);
           element.classList.remove('hapus-animasi');
         });
     }, 300);
   }

   db.ref('pesan').on('child_added', function(snapshot) {
     const data = snapshot.val();
     const key = snapshot.key;
     const element = tampilkanPesan(data.nama, data.teks, data.foto, data.waktu, key);
     if (element) {
       pesanElements.set(key, element);
     }
   });

   db.ref('pesan').on('child_removed', function(snapshot) {
     const key = snapshot.key;
     const element = pesanElements.get(key);
     if (element) {
       element.remove();
       pesanElements.delete(key);
     }
   });

   function tampilkanPesan(nama, teks, foto, waktu, key) {
     const div = document.createElement('div');
     div.className = 'pesan ' + (nama === namaSaya ? 'kirim' : 'terima');
     div.dataset.key = key;
     let isi = '';
     if (nama !== namaSaya) {
       isi += `<div class="nama">${nama}</div>`;
     }
     if (foto) {
       isi += `<img src="${foto}" alt="foto" loading="lazy">`;
     }
     if (teks) {
       isi += `<div class="teks">${teks}</div>`;
     }
     isi += `<div class="waktu">${waktu}</div>`;
     if (nama === namaSaya) {
       isi += `<div class="hapus-btn" onclick="hapusPesan('${key}', this.parentElement)">✕</div>`;
     }
     div.innerHTML = isi;
     const container = document.getElementById('daftarPesan');
     container.appendChild(div);
     container.scrollTop = container.scrollHeight;
     return div;
   }

   document.addEventListener('click', function(e) {
     const picker = document.getElementById('emojiPicker');
     const btn = document.querySelector('.btn-emoji');
     if (!picker.contains(e.target) && !btn.contains(e.target)) {
       picker.style.display = 'none';
     }
   });
 </script>
 </body>
    </html>
