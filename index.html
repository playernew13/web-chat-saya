<!DOCTYPE html>
 <html>
 <head>
   <title>Web Chat</title>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <style>
     * { box-sizing: border-box; font-family: sans-serif; }
     body { max-width: 500px; margin: 0 auto; padding: 20px; }
     #halamanMasuk { text-align: center; padding-top: 100px; }
     #halamanChat { display: none; }
     #daftarPesan { height: 550px; overflow-y: auto; padding: 15px; background: #f9f9f9; border-radius: 12px; margin-bottom: 15px; }
     .input-bawah { display: flex; gap: 8px; align-items: center; }
     input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
     button { padding: 12px 15px; background: #6c5ce7; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
     button:active { opacity: 0.8; }
     .btn-foto { background: #2ecc71; padding: 12px 18px; font-size: 20px; }
     .pesan { margin: 8px 0; padding: 10px 14px; background: #e8f0fe; border-radius: 12px; }
     .pesan img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
   </style>
 </head>
 <body>
 <!-- HALAMAN MASUK -->
 <div id="halamanMasuk">
   <h2>💬 Web Chat</h2>
   <p>Masuk untuk mulai mengobrol</p>
   <br>
   <input type="text" id="namaInput" placeholder="Masukkan nama kamu...">
   <br><br>
   <button onclick="masukObrolan()">Masuk Obrolan</button>
 </div>
 <!-- HALAMAN CHAT -->
 <div id="halamanChat">
   <div id="daftarPesan"></div>
   <div class="input-bawah">
     <input type="file" id="inputFoto" accept="image/*" style="display:none;" onchange="pilihFoto(this)">
     <button class="btn-foto" onclick="document.getElementById('inputFoto').click()">📷</button>
     <input type="text" id="inputPesan" placeholder="Ketik pesan...">
     <button onclick="kirimPesan()">Kirim</button>
   </div>
 </div>
 <!-- FIREBASE -->
 <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
 <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-database-compat.js"></script>
 <script>
   const firebaseConfig = {
     apiKey: "AIzaSyBQ0_bbQ1FPRUx1zwi57klC329AG7H9Fwk",
     authDomain: "web-chat-saya.firebaseapp.com",
     databaseURL: "https://web-chat-saya-default-rtdb.asia-southeast1.firebasedatabase.app/",
     projectId: "web-chat-saya",
     storageBucket: "web-chat-saya.firebasestorage.app",
     messagingSenderId: "339753603338",
     appId: "1:339753603338:web:89fa40e03f3ead1c7f1a2b"
   };
   firebase.initializeApp(firebaseConfig);
   const db = firebase.database();
   function masukObrolan() {
     const nama = document.getElementById('namaInput').value.trim();
     if (!nama) { alert('Masukkan nama dulu!'); return; }
     localStorage.setItem('namaPengguna', nama);
     document.getElementById('halamanMasuk').style.display = 'none';
     document.getElementById('halamanChat').style.display = 'block';
   }
   function kirimPesan() {
     const nama = localStorage.getItem('namaPengguna') || 'Anonim';
     const teks = document.getElementById('inputPesan').value.trim();
     if (!teks) return;
     db.ref('pesan').push({
       nama: nama,
       teks: teks,
       waktu: new Date().toLocaleTimeString('id-ID')
     });
     document.getElementById('inputPesan').value = '';
   }
   function pilihFoto(input) {
     if (!input.files || !input.files[0]) return;
     const file = input.files[0];
     const reader = new FileReader();
     reader.onload = function(e) {
       const nama = localStorage.getItem('namaPengguna') || 'Anonim';
       db.ref('pesan').push({
         nama: nama,
         foto: e.target.result,
         waktu: new Date().toLocaleTimeString('id-ID')
       });
     };
     reader.readAsDataURL(file);
     input.value = '';
   }
   db.ref('pesan').on('child_added', function(snapshot) {
     const data = snapshot.val();
     tampilkanPesan(data.nama, data.teks, data.foto, data.waktu);
   });
   function tampilkanPesan(nama, teks, foto, waktu) {
     const div = document.createElement('div');
     div.className = 'pesan';
     let isi = `<strong style="color:#5865f2">${nama}</strong> <span style="font-size:11px; color:#888; margin-left:8px">${waktu}</span>`;
     if (foto) isi += `<br><img src="${foto}" alt="foto">`;
     if (teks) isi += `<p style="margin:8px 0 0 0;">${teks}</p>`;
     div.innerHTML = isi;
     document.getElementById('daftarPesan').appendChild(div);
     document.getElementById('daftarPesan').scrollTop = document.getElementById('daftarPesan').scrollHeight;
   }
 </script>
 </body>
  </html>
