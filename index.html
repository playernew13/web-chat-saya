<!DOCTYPE html>
 <html lang="id">
 <head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Web Chat - Mirip WhatsApp</title>
   <link rel="stylesheet" href="style.css">
 </head>
 <body>
 <div id="loginPage" class="page active">
   <div class="login-box">
     <h1>💬 Web Chat</h1>
     <p>Masuk untuk mulai mengobrol</p>
     <input type="text" id="namaPengguna" placeholder="Masukkan Nama / Nomor HP">
     <button onclick="masuk()">Masuk Obrolan</button>
   </div>
 </div>
 <div id="chatPage" class="page">
   <div class="chat-header">
     <span id="namaPenggunaTampil">Pengguna</span>
     <button onclick="keluar()" class="btn-keluar">Keluar</button>
   </div>
   <div id="daftarPesan" class="chat-body"></div>
   <div class="chat-kirim">
     <input type="text" id="inputPesan" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter')kirimPesan()">
     <button onclick="kirimPesan()">Kirim</button>
   </div>
 </div>
 <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  // TODO: Add SDKs for Firebase products that you want to use
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
  apiKey: "AIzaSyBQ0_bbQ1FPRUx1zwi57klC329AG7H9Fwk",
  authDomain: "web-chat-saya.firebaseapp.com",
  databaseURL: "https://web-chat-saya-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "web-chat-saya",
  storageBucket: "web-chat-saya.firebasestorage.app",
  messagingSenderId: "339753603338",
  appId: "1:339753603338:web:89fa40e03f3ead1c742af3"
};

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
 window.db = db;
 window.ref = ref;
 window.push = push;
 window.onChildAdded = onChildAdded;
</script>
 <script src="app.js"></script>
 </body>
 </html>
